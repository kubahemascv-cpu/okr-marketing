<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OKR Kubah Emas</title>
<meta name="theme-color" content="#1F2128">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OKR Kubah Emas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --m:#C81E8C;--m-hi:#FF5CB1;--m-d:#9B1259;--m-l:#FCE8F4;--m-b:#F3B5DA;
  --ch:#1F2128;--ch2:#2A2D36;--bg:#F4F4F6;--bg2:#E9E9EE;--card:#fff;--card2:#FAFAFB;
  --txt:#1F2128;--txt2:#41454F;--mut:#80848F;--bdr:#E6E6EB;
  --ok:#16A34A;--ok-l:#E8F7EE;--warn:#D97706;--warn-l:#FEF3E2;--bad:#DC2626;--bad-l:#FEF3F2;
  --shd:0 1px 2px rgba(31,33,40,.04),0 6px 20px rgba(31,33,40,.05);
  --font:'Plus Jakarta Sans',-apple-system,sans-serif;--r:18px;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;padding-bottom:96px}
button,input,select,textarea{font-family:var(--font)}
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bdr);padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top))}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#E0309B,#C81E8C);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;letter-spacing:.04em;color:#fff;flex-shrink:0}
.bn{font-size:15px;font-weight:800;letter-spacing:-.01em}.bs{font-size:11px;color:var(--mut)}
.who{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--ch);color:var(--m-hi);padding:8px 13px;border-radius:999px;border:none;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--shd);padding:18px;margin-bottom:14px}
.hero{background:radial-gradient(120% 140% at 100% 0%,rgba(200,30,140,.34),transparent 55%),var(--ch);color:#fff;border:none}
.hero .mut{color:rgba(255,255,255,.62)}
.mut{color:var(--mut)}
.h{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.hero .h{color:rgba(255,255,255,.55)}
.big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.hero .big{color:var(--m-hi)}
.hero .fill{background:var(--m-hi)}
.mid{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.sm{font-size:12px;line-height:1.55}
.bar{height:9px;border-radius:99px;background:var(--bdr);overflow:hidden;margin-top:12px}
.hero .bar{background:rgba(255,255,255,.14)}
.fill{height:100%;border-radius:99px;background:var(--m)}
.fill.ok{background:var(--ok)}.fill.warn{background:var(--warn)}.fill.bad{background:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.sp{margin-left:auto}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--ok-l);color:var(--ok)}.tag.warn{background:var(--warn-l);color:var(--warn)}.tag.bad{background:var(--bad-l);color:var(--bad)}.tag.na{background:var(--bg2);color:var(--mut)}
.note{display:flex;gap:10px;font-size:12px;line-height:1.55;padding:11px 13px;border-radius:13px;background:var(--card2);border:1px solid var(--bdr);margin-bottom:14px;color:var(--txt2)}
.note.warn{background:var(--warn-l);border-color:#F6D8A8;color:#7C4A03}
.note.bad{background:var(--bad-l);border-color:#FBC9C4;color:#8F1D14}
.note.ok{background:var(--ok-l);border-color:#BDE5CC;color:#14532D}
.kr-t{font-size:13.5px;font-weight:800;line-height:1.35}
.kr-r{font-size:11px;color:var(--mut);font-weight:600;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:8px 6px;text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);border-bottom:2px solid var(--bdr)}
td{padding:10px 6px;border-bottom:1px solid var(--bdr)}
th.r,td.r{text-align:right}
tr:last-child td{border-bottom:none}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--mut);margin:12px 0 6px}
.lbl:first-child{margin-top:0}
.inp,.sel,.ta{width:100%;border:1.5px solid var(--bdr);border-radius:13px;background:var(--card2);padding:0 14px;font-size:14px;font-weight:600;color:var(--txt);outline:none}
.inp,.sel{height:46px}
.ta.big{min-height:140px;max-height:480px;overflow:auto}
.cnt{font-size:11.5px;color:var(--mut);text-align:right;margin:4px 2px 12px}.cnt.near{color:var(--warn);font-weight:700}.cnt.full{color:var(--bad);font-weight:700}
.ta{padding:12px 14px;min-height:78px;resize:vertical;font-weight:500;line-height:1.5}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--m);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;height:50px;border:none;border-radius:14px;background:var(--m);color:#fff;font-size:14.5px;font-weight:800;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--bg2);color:var(--txt)}
.btn.sm{height:38px;font-size:12.5px;margin-top:0;width:auto;padding:0 16px;border-radius:11px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1.5px solid var(--bdr);background:var(--card);border-radius:99px;padding:9px 15px;font-size:12.5px;font-weight:700;color:var(--txt2);cursor:pointer}
.chip.on{background:var(--ch);color:var(--m-hi);border-color:var(--ch)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bdr);padding:8px 8px max(8px,env(safe-area-inset-bottom))}
.nav-in{max-width:760px;margin:0 auto;display:flex;gap:2px}
.nav button{flex:1;border:none;background:none;padding:7px 2px;border-radius:12px;font-size:10.5px;font-weight:700;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{background:var(--ch);color:var(--m-hi)}
.gate{max-width:380px;margin:12vh auto 0;padding:0 18px;text-align:center}
.gate .logo{width:64px;height:64px;font-size:18px;border-radius:19px;margin:0 auto 18px}
.pin{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:800}
.pick{display:flex;flex-direction:column;gap:10px;text-align:left}
.pick button{border:1.5px solid var(--bdr);background:var(--card);border-radius:15px;padding:14px 16px;cursor:pointer;text-align:left}
.pick b{display:block;font-size:15px}.pick span{font-size:11.5px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ch);color:#fff;padding:11px 18px;border-radius:99px;font-size:12.5px;font-weight:700;z-index:99;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}
.hb{border-top:1px solid var(--bdr);padding:12px 0}
.hb:first-child{border-top:none;padding-top:0}
.spin{text-align:center;padding:60px 0;color:var(--mut);font-size:13px;font-weight:600}
@media(max-width:380px){.big{font-size:32px}.grid2{grid-template-columns:1fr}}
.vhead .mid{margin-bottom:4px}.vhead .sm{margin-bottom:14px}
.cfg-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
.objstrip{border-left:4px solid var(--m)}
.objstrip .obj{font-size:16px;font-weight:800;line-height:1.35;margin:4px 0 6px}
.chks{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chks label{display:flex;align-items:center;gap:7px;border:1.5px solid var(--bdr);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--card)}
.chks input{width:16px;height:16px;accent-color:var(--m)}
.grp{margin:22px 0 4px;padding-top:16px;border-top:1px solid var(--bdr);font-size:13px}
.grp:first-of-type{margin-top:14px}
.grp .tag{margin-right:6px}
.inp.ro{background:var(--bg2);color:var(--mut);cursor:not-allowed}
.inp.auto{background:var(--bg2);color:var(--txt);border-style:dashed;cursor:default}

.nav button .nl{display:block}

/* ═════════ DESKTOP (≥1000px): navigasi di samping, area utama melebar mengikuti layar ═════════ */
@media(min-width:1000px){
  :root{--topH:61px;--sideW:224px}
  body.shell{padding-left:var(--sideW);padding-bottom:0}
  body.shell .top{margin-left:calc(-1*var(--sideW))}
  .top-in{max-width:none;padding:0 20px}
  .nav{top:var(--topH);bottom:0;left:0;right:auto;width:var(--sideW);border-top:none;border-right:1px solid var(--bdr);padding:18px 12px;overflow-y:auto;background:#fff}
  .nav-in{max-width:none;flex-direction:column;gap:6px}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:13px;font-size:13.5px;text-align:left}
  .nav button .ic{font-size:18px;width:24px;text-align:center}
  .nav button:hover:not(.on){background:var(--bg2)}
  .wrap{max-width:none;margin:0;padding:26px 32px 40px}
  body.shell #view{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:16px;align-items:start}
  body.shell #view>*{grid-column:1/-1;margin-bottom:0}
  body.shell #view>.g{grid-column:auto}
  body.shell #view>.narrow{max-width:760px}
  body.shell #view>.btn{width:auto;justify-self:start;padding:0 22px;margin:0}
  body.shell #view>.note{max-width:980px}
  .vhead .sm{margin-bottom:0}
  .vhead .mid{font-size:28px;margin-bottom:6px}
  .card{margin-bottom:0}
  .gridA{grid-template-columns:repeat(4,1fr)}
  .gridB{grid-template-columns:repeat(3,1fr)}
  .grid2{margin-top:14px}
  .hb .sel{max-width:260px}
  .cfg-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .toast{bottom:28px;left:calc(50% + var(--sideW)/2)}
}

.tag.done{background:var(--ok);color:#fff}
.krn{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:12px 0 2px}
.krn .now{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1}
.krn .arr{color:var(--mut);font-weight:800;font-size:20px}
.krn .tg{font-size:24px;font-weight:800;color:var(--mut)}
.crow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--bdr)}
.cval{font-size:15px;font-weight:800;text-align:right}
.cbar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--bdr);overflow:hidden}
.cbar .fill{background:var(--m)}
details.card summary{font-size:13px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="top" id="top" style="display:none"><div class="top-in">
  <div class="logo">OKR</div>
  <div><div class="bn">OKR Kubah Emas</div><div class="bs" id="bs">Nov 2026 – Jan 2027</div></div>
  <button class="who" id="whobtn" onclick="switchWho()"></button>
</div></div>
<div class="wrap" id="view"></div>
<div class="nav" id="nav" style="display:none"><div class="nav-in" id="navin"></div></div>
<div id="toastbox"></div>

<script>
// ═════════════ KONFIGURASI ═════════════
var APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbzMAsn2ClE8-Roz1UY5lkM7hHqw5T5ulNGOL0v0ybLIZhWHelUeoiFGjmYEHAILi52b/exec';
var PIN='1601';
var APP_VER='v24';
var NEED_SCRIPT=7;   // versi Apps Script yang dibutuhkan app ini
// App Brand Creator: sumber angka Dicky (dibaca langsung, tidak diketik ulang di sini)
var BC_URL='https://script.google.com/macros/s/AKfycbx7fvep5uCT_s_RUYbbcv4liCG0jRq5z53kzmz9BaL3QDTw2dI2PfZGo00UHhHnIPu0/exec';
var BC_KATS=['Awareness Online','Awareness Offline','Iklan Penjualan'],BC_DIV='Kubah Emas',BC_WK='__winner__';   // OKR ini khusus Toko Kubah Emas: Kumasindo tidak dihitung
// App Performance Toko (dashboard CS Toko): sumber Total Traffic, Leads Luar Area, Leads Luar Produk.
// Dibaca langsung dari Sheet CS Toko yang sama dengan dashboard (harus "Anyone with the link"), tidak diketik ulang.
var CS_SHEET_ID='1Z3kXM4e4Ic6YUhhYzB3mrlSwXAbrYqJedgNDsbNtmuk',CS_TAB='Ringkasan Harian';
var AUTO_KEYS=['chatNew','chatEx','offTraffic','luarArea','luarProduk'];   // Spam tetap diisi manual
// Sheet penjualan (REPORT): sumber Jumlah Nota dan Beli lewat chat (Deal Online). Sama dengan sumber Jumlah Pembelian di app Performance Toko.
var RP_ID='1n9Mp66i3JwJE6hdV3jevhOw8EOa1b7Lo8FvBegtsTo4',RP_TAB='REPORT',RP_DAILY='A127:J156',RP_MONTH='A62:B73';
var RP_COL_NOTA=8,RP_COL_ONLINE=9;   // kolom I (JUMLAH nota) dan J (NOTA ONLINE) di tabel harian; kolom A = tanggal
var RP_KEYS=['total','online'];
var PERIOD={start:'2026-11-01',end:'2027-01-31',months:['2026-11','2026-12','2027-01']};
var OBJ_TEXT='Lebih banyak calon pembeli yang masuk ke Kubah Emas akhirnya membeli.';
var MONTH_ID=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
// ci = penanda peran yang tersimpan di kolom KR pada check-in (sama dengan versi lama, supaya riwayat tetap nyambung)
var PEOPLE={
  Lukman:{role:'Manager Marketing + Advertising',ci:'mgr',roles:['ads','mgr'],admin:true},
  Dicky:{role:'Brand Creator',ci:'brand',roles:['brand']},
  Tri:{role:'CS Kubah Emas',ci:'cs',roles:['cs']},
  Faizal:{role:'CS Kumasindo',ci:'kum',roles:['kum']}
};
var ROLE_NAME={brand:'Brand Creator',ads:'Advertiser',cs:'CS Kubah Emas',kum:'CS Kumasindo',mgr:'Manager'};
// baris kontribusi per peran: [kunci angka, label, kunci target]
var ROLE_ROWS={
  cs:[['conv','Online Chat Conversion Rate',null],['chat','Chat masuk (baru + lama)',null],['online','Deal Online',null]],
  kum:[['rujukan','Pembelian dari rujukan Kumasindo','t_rujukan']]
};
// KR1 dan KR2 memakai Jumlah Nota & Total Traffic. chat_base/online_base/online_target hanya untuk indikator Online Chat Conversion Rate (CS), bukan KR.
// conv_target disimpan dalam persen (35 = 35%). nota_* menggantikan total_* (nilai lama dipakai kalau nota_* belum pernah diisi).
var DEFAULTS={traffic_base:null,nota_base:441,conv_target:null,nota_target:513,chat_base:1800,online_base:110,online_target:144,t_traffic_baru:null,t_vtr:null,t_winner_toko:null,t_rujukan:null};
var LEGACY_KEY={nota_base:'total_base',nota_target:'total_target'};
var CFG_LOCK=[['traffic_base','Total Traffic per bulan — Patokan Awal'],['nota_base','Jumlah Nota per bulan — Patokan Awal'],
  ['conv_target','Target Traffic to Conversion Rate — Akhir Periode (%)'],['nota_target','Target Jumlah Nota per bulan — Akhir Periode']];
var CFG_ONLINE=[['chat_base','Chat masuk per bulan — patokan awal'],['online_base','Deal Online per bulan — patokan awal'],['online_target','Target Deal Online — akhir Januari']];
var CFG_TARGET=[['t_traffic_baru','Advertiser: Traffic Baru (Chat New Leads) per bulan'],['t_vtr','Advertiser: target Valid Traffic Rate (%)'],['t_winner_toko','Brand Creator: target Winner per bulan, Toko Kubah Emas saja'],['t_rujukan','Pembelian dari rujukan Kumasindo per bulan']];
var CFG_FIELDS=CFG_LOCK.concat(CFG_ONLINE,CFG_TARGET);

// ═════════════ UTIL ═════════════
var S={ok:false,who:'',tab:'home',loaded:false,err:'',hbEdit:'',bcErr:''};
var D={config:{},checkins:[],angka:[],hambatan:[],v:0,bc:null};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function p2(n){return String(n).padStart(2,'0');}
function dstr(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function today(){return dstr(new Date());}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function weekStart(s){var d=pd(s||today());var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dstr(d);}
function dim(ym){var a=ym.split('-');return new Date(+a[0],+a[1],0).getDate();}
function ymShort(ym){var a=ym.split('-');return MONTH_ID[+a[1]-1].slice(0,3)+' '+a[0];}
function dLabel(s){if(!s)return '—';var d=pd(s);return d.getDate()+' '+MONTH_ID[d.getMonth()].slice(0,3)+' '+d.getFullYear();}
function dDiff(a,b){return Math.round((pd(a)-pd(b))/86400000);}
function n0(n){return Math.round(n).toLocaleString('id-ID');}
function pc(x,dec){return (x*100).toFixed(dec==null?1:dec).replace('.',',')+'%';}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(msg,bad){var t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=msg;$('toastbox').appendChild(t);setTimeout(function(){t.remove();},bad?5000:2200);}

// ═════════════ API ═════════════
function apiReady(){return APPS_SCRIPT_URL&&APPS_SCRIPT_URL.indexOf('PASTE_')!==0;}
function scriptOld(){return S.loaded&&D.v!==NEED_SCRIPT;}
var OLD_MSG='Apps Script belum diperbarui ke versi 7. Deploy ulang dulu (Deploy > Manage deployments > pensil > Version: New).';
function bcLoad(){
  // kegagalan Brand Creator tidak boleh menjatuhkan seluruh app: hanya baris Dicky yang kosong
  return fetch(BC_URL+'?action=load&cb='+Date.now()).then(function(r){return r.json();}).then(function(j){
    if(!j.ok||!j.today)throw new Error(j.error||'Respons Brand Creator tidak dikenal');
    S.bcErr='';return j;
  }).catch(function(e){S.bcErr=String(e.message||e);return null;});
}
// ═════════════ PERFORMANCE TOKO (Sheet CS Toko + Sheet Penjualan/REPORT) ═════════════
function csDate(s){s=String(s||'').trim();var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+'-'+p2(m[2])+'-'+p2(m[1]);
  m=s.match(/Date\((\d+),(\d+),(\d+)\)/);if(m)return m[1]+'-'+p2(+m[2]+1)+'-'+p2(m[3]);return null;}
function csNum(x){if(x===undefined||x===null)return null;var s=String(x).trim();if(s===''||s==='-')return null;var n=parseFloat(s.replace(/[^\d.-]/g,''));return isNaN(n)?null:n;}
// Kolom Diluar Area / Diluar Produk berisi "Nama=Jumlah, Nama2=Jumlah2". Yang diambil hanya ANGKA setelah "=".
// Nama boleh mengandung koma ("RELING, TENGKI=2" = satu entri, jumlah 2), jadi pemisahnya pola "teks=angka", bukan koma.
function csEntries(x){var s=String(x==null?'':x).trim();if(!s||s==='-')return {sum:0,bad:false};var sum=0;
  var rest=s.replace(/([^=]+?)=\s*(\d+)\s*(?:,|$)/g,function(m,n,c){sum+=parseInt(c,10);return ' ';}).replace(/[\s,]+/g,' ').trim();
  return {sum:sum,bad:!!rest};}
function gvCell(r,i){var c=(r.c||[])[i];if(!c)return '';if(c.f!==undefined&&c.f!==null)return String(c.f);if(c.v!==undefined&&c.v!==null)return String(c.v);return '';}
// Baca satu tab Google Sheet (JSONP; sheet harus "Anyone with the link"). range opsional: A1 notation tanpa header.
function gvizFetch(id,tab,range){
  return new Promise(function(resolve,reject){
    var cb='gvCb_'+Math.random().toString(36).slice(2),done=false,sc=document.createElement('script'),tm;

// ═════════════ KONFIG & PERHITUNGAN ═════════════
function cfg(){
  var c={};
  Object.keys(DEFAULTS).forEach(function(k){
    var raw=D.config?D.config[k]:undefined;
    if(raw===undefined&&LEGACY_KEY[k]&&D.config)raw=D.config[LEGACY_KEY[k]];
    if(raw===undefined)c[k]=DEFAULTS[k];
    else if(raw==='')c[k]=null;
    else{var n=Number(raw);c[k]=isNaN(n)?DEFAULTS[k]:n;}
  });
  return c;
}
// Satu baris angka per tanggal (kumulatif sejak tanggal 1). Per bulan dipakai baris terakhirnya.
// Bulan yang belum selesai: angka tetap tampil apa adanya, tapi status dinilai dari laju (proyeksi / pro-rata).
function calc(){
  var c=cfg();
  var rows=(D.angka||[]).slice().sort(function(a,b){return a.asOf<b.asOf?-1:a.asOf>b.asOf?1:0;});
  var byM={};rows.forEach(function(r){byM[r.asOf.slice(0,7)]=r;});
  // KR1: Jumlah Nota ÷ Total Traffic. Patokan dan target diisi Manager.
  var convBase=(c.traffic_base>0&&c.nota_base!=null)?c.nota_base/c.traffic_base:null;
  var convTarget=c.conv_target!=null?c.conv_target/100:null;
  // indikator Online/CS: Deal Online ÷ chat masuk (rumus lama KR1)
  var oBase=c.chat_base>0?c.online_base/c.chat_base:0;
  var oTarget=c.chat_base>0?c.online_target/c.chat_base:0;
  var notaOk=c.nota_base!=null&&c.nota_target!=null;
  var months=PERIOD.months.map(function(ym,i){
    var r=byM[ym],f=(i+1)/3;
    var m={ym:ym,i:i+1,has:!!r,
      msConv:(convBase!=null&&convTarget!=null)?convBase+(convTarget-convBase)*f:null,
      msO:oBase+(oTarget-oBase)*f,
      msTotal:notaOk?c.nota_base+(c.nota_target-c.nota_base)*f:null};
    if(r){
      var day=+r.asOf.slice(8),d=dim(ym),running=day<d;
      m.asOf=r.asOf;m.day=day;m.dim=d;m.running=running;m.early=running&&day<7;m.k=running?d/day:1;
      ['chat','online','total','iklan','konten','rujukan','lainnya'].forEach(function(k){m[k]=r[k]||0;});
      m.chatNew=r.chatNew;m.chatEx=r.chatEx;m.offTraffic=r.offTraffic;m.luarArea=r.luarArea;m.luarProduk=r.luarProduk;m.spam=r.spam;   // null = baris lama sebelum Total Traffic dipakai
      m.traffic=(r.chatNew==null||r.chatEx==null||r.offTraffic==null)?null:r.chatNew+r.chatEx+r.offTraffic;
      m.projTotal=r.total*m.k;
      m.conv=m.traffic>0?r.total/m.traffic:null;       // KR1
      m.oconv=r.chat>0?r.online/r.chat:null;            // Online Chat Conversion Rate
    }
    return m;
  });
  var act=null;months.forEach(function(m){if(m.has)act=m;});
  return {c:c,months:months,act:act,convBase:convBase,convTarget:convTarget,oBase:oBase,oTarget:oTarget};
}
// status: TERCAPAI (target akhir sudah dicapai) / ON TRACK (sesuai atau di atas target bulan ini) / WASPADA (≥70%) / TERTINGGAL
function stOf(ratio,done){if(done)return 'TERCAPAI';if(ratio==null)return null;return ratio>=1?'ON TRACK':ratio>=0.7?'WASPADA':'TERTINGGAL';}
function stCls(s){return {'TERCAPAI':'done','ON TRACK':'ok','WASPADA':'warn','TERTINGGAL':'bad'}[s]||'na';}
function tagOf(s){return '<span class="tag '+stCls(s)+'">'+(s||'BELUM ADA DATA')+'</span>';}
function worst(list){var o=['TERTINGGAL','WASPADA','ON TRACK','TERCAPAI'],w=null;list.forEach(function(s){if(s&&(w==null||o.indexOf(s)<o.indexOf(w)))w=s;});return w;}
function ratioTo(now,base,ms){var den=ms-base;return den>0?(now-base)/den:(now>=ms?1:0);}

// KR 1: Traffic to Conversion Rate = Jumlah Nota ÷ Total Traffic (chat baru + chat lama + customer datang offline)
function kr1(K){
  var a=K.act,o={code:'KR 1',title:'Traffic to Conversion Rate',unit:'pct',now:null,tgt:K.convTarget,base:K.convBase,ms:null,st:null,extra:'',def:'Jumlah nota ÷ total traffic (chat baru + chat lama + datang ke toko)'};
  if(K.convBase==null||K.convTarget==null){o.msg='Patokan atau target belum diisi di Pengaturan.';return o;}
  if(!a)return o;
  if(a.traffic==null){o.msg='Angka bulan ini belum memuat rincian Total Traffic. Manager mengisi ulang di Pengaturan.';return o;}
  if(!(a.traffic>0)){o.msg='Total Traffic masih 0.';return o;}
  o.now=a.conv;o.ms=a.msConv;
  o.st=stOf(ratioTo(a.conv,K.convBase,a.msConv),a.conv>=K.convTarget);
  o.extra='Nota '+n0(a.total)+' dari Total Traffic '+n0(a.traffic)+' (chat baru '+n0(a.chatNew)+' · chat lama '+n0(a.chatEx)+' · datang ke toko '+n0(a.offTraffic)+')';
  return o;
}
// KR 2: Jumlah Transaksi per bulan = Jumlah Nota. Bulan berjalan memakai proyeksi akhir bulan.
function kr2(K){
  var a=K.act,c=K.c,o={code:'KR 2',title:'Jumlah Transaksi per Bulan',unit:'n',now:null,tgt:c.nota_target,base:c.nota_base,ms:null,st:null,extra:'',def:'Jumlah nota dalam sebulan'};
  if(c.nota_base==null||!(c.nota_target>0)){o.msg='Patokan atau target belum diisi di Pengaturan.';return o;}
  if(!a)return o;
  o.now=a.running?a.projTotal:a.total;o.ms=a.msTotal;o.proj=a.running;
  o.st=stOf(ratioTo(o.now,c.nota_base,a.msTotal),a.total>=c.nota_target);
  o.extra=a.running?'Baru '+n0(a.total)+' nota sampai '+dLabel(a.asOf)+' (proyeksi akhir bulan '+n0(a.projTotal)+')':'Total bulan itu '+n0(a.total)+' nota';
  return o;
}
// Angka Brand Creator bulan berjalan, dihitung ulang dari data app Brand Creator dengan aturan yang SAMA seperti dashboard-nya:
// dibuat = creative tercatat bulan itu; diuji = creative online yang tayang pertamanya bulan itu; winner = yang diputuskan WINNER oleh Advertiser.
function bcMonth(){
  var B=D.bc;if(!B)return null;
  var td=B.today,m=B.month||td.slice(0,7);
  var tay=function(cid){return (B.tayang||[]).filter(function(t){return t.cid===cid;});};
  var first=function(c){var best='';tay(c.id).forEach(function(t){if(t.mulai<=td&&(!best||t.mulai<best))best=t.mulai;});return best;};
  var isWin=function(c){var k=(B.keputusan||[]).filter(function(x){return x.cid===c.id;})[0];return !!k&&k.status==='WINNER';};
  // hanya divisi Toko Kubah Emas; creative Kumasindo tidak ikut dihitung
  var cr=(B.creatives||[]).filter(function(c){return c.divisi===BC_DIV;});
  var made=cr.filter(function(c){return (c.created||'').slice(0,7)===m;}).length;
  var tested=cr.filter(function(c){return c.kategori!=='Awareness Offline'&&first(c).slice(0,7)===m;});
  var gt=0;
  BC_KATS.forEach(function(k){var r=(B.targets||[]).filter(function(x){return x.bulan===m&&x.kategori===k&&x.divisi===BC_DIV;})[0];gt+=r?r.jumlah:0;});
  // target Winner di Brand Creator satu angka untuk semua divisi (tidak bisa dipisah), jadi tidak dipakai. Target Winner Toko diisi di Pengaturan OKR.
  var tw=cfg().t_winner_toko;
  var day=+td.slice(8),dm=dim(m);
  return {m:m,made:made,tested:tested.length,win:tested.filter(isWin).length,gt:gt>0?gt:null,tw:tw,day:day,dim:dm,p:td.slice(0,7)>m?1:day/dm};
}
function bcContrib(){
  var b=bcMonth();
  if(!b)return {rows:[{lbl:'Creative dibuat',txt:'—'},{lbl:'Creative diuji',txt:'—'},{lbl:'Winner',txt:'—'}],st:null,
    note:'Data Brand Creator tidak bisa dimuat'+(S.bcErr?' ('+S.bcErr+')':'')+'. Tutup lalu buka lagi app untuk memuat ulang.'};
  // aturan status sama dengan dashboard Brand Creator: Dibuat <80% atau Winner <50% dari laju = TERTINGGAL; keduanya ≥100% = ON TRACK
  var rA=b.gt?{lbl:'Creative dibuat',txt:n0(b.made),tgtTxt:n0(b.gt)}:{lbl:'Creative dibuat',txt:n0(b.made)};
  var rB={lbl:'Creative diuji',txt:n0(b.tested)};

  if(b.tw!=null){
    if(b.tw>0){B=b.win/(b.tw*b.p);rC.tgtTxt=n0(b.tw);rC.st=b.win>=b.tw?'TERCAPAI':B>=1?'ON TRACK':B>=0.5?'WASPADA':'TERTINGGAL';rC.prog=clamp(b.win/b.tw,0,1);}
    else rC.st='TERCAPAI';
  }

}

  if(!a)return out;
  if(a.chatNew==null){out.note='Angka bulan ini belum memuat Chat New Leads. Manager mengisi di Pengaturan. '+out.note;return out;}
  rT.txt=n0(a.chatNew);
  if(c.t_traffic_baru>0){
    var exp=c.t_traffic_baru*(a.running?a.day/a.dim:1);
    rT.tgtTxt=n0(c.t_traffic_baru);rT.st=stOf(exp>0?a.chatNew/exp:null,a.chatNew>=c.t_traffic_baru);rT.prog=clamp(a.chatNew/c.t_traffic_baru,0,1);sts.push(rT.st);
  }else miss.push('target Traffic Baru');
  if(a.luarArea==null||a.luarProduk==null||a.spam==null){
    out.note='Angka bulan ini belum memuat rincian Leads Luar Area, Luar Produk, dan Spam. Manager mengisi di Pengaturan. '+out.note;return out;
  }
  var inv=a.luarArea+a.luarProduk+a.spam,valid=a.chatNew-inv;
  rV.txt=n0(valid);rV.sub='Luar Area '+n0(a.luarArea)+' · Luar Produk '+n0(a.luarProduk)+' · Spam '+n0(a.spam);
  if(a.chatNew>0){
    var rate=valid/a.chatNew;rR.txt=pc(rate);rR.sub=n0(valid)+' valid dari '+n0(a.chatNew)+' traffic baru';
    if(c.t_vtr>0){var tg=c.t_vtr/100;rR.tgtTxt=pc(tg);rR.st=stOf(rate/tg,false);rR.prog=clamp(rate/tg,0,1);sts.push(rR.st);}
    else miss.push('target Valid Traffic Rate');
  }
  out.st=miss.length?null:worst(sts);
  if(miss.length)out.note='Belum diisi di Pengaturan: '+miss.join(' dan ')+'. '+out.note;
  return out;
}
// kontribusi satu peran → {rows:[{lbl,val,txt,tgt,ratio,st}], st}
function roleContrib(role,K){
  var a=K.act,c=K.c;
  if(role==='mgr'){
    var hb=(D.hambatan||[]).filter(function(h){return h.status!=='Selesai';}),t=today();
    var late=hb.filter(function(h){return h.due&&h.due<t;}).length,any=(D.hambatan||[]).length>0;
    return {rows:[{lbl:'Hambatan terbuka',txt:n0(hb.length)},{lbl:'Lewat tenggat',txt:n0(late),bad:late>0}],
      st:!any?null:late>0?'WASPADA':'ON TRACK',note:'Hambatan hanya alat untuk menggerakkan KR. Tidak dinilai dari jumlah yang selesai.'};
  }
  if(role==='brand')return bcContrib();
  if(role==='ads')return adsContrib(K);
  var out={rows:[],st:null,noTarget:false},sts=[];
  ROLE_ROWS[role].forEach(function(r){
    var row={lbl:r[1],txt:'—'};
    if(a){
      if(r[0]==='conv'){
        row.txt=a.oconv==null?'—':pc(a.oconv);
        if(a.oconv!=null&&K.oTarget>0){var so=stOf(ratioTo(a.oconv,K.oBase,a.msO),a.oconv>=K.oTarget);row.tgtTxt=pc(K.oTarget);row.st=so;row.prog=clamp(ratioTo(a.oconv,K.oBase,K.oTarget),0,1);sts.push(so);}
      }else{
        var v=a[r[0]];row.txt=v==null?'—':n0(v);
        var tg=r[2]?c[r[2]]:null;
        if(tg>0&&v!=null){
          var exp=tg*(a.running?a.day/a.dim:1);
          row.tgtTxt=n0(tg);row.st=stOf(exp>0?v/exp:null,v>=tg);row.prog=clamp(v/tg,0,1);sts.push(row.st);
        }else if(r[2])out.noTarget=true;
      }
    }
    out.rows.push(row);
  });
  out.st=worst(sts);
  return out;
}

    '<label class="lbl">Catatan: siapa mengerjakan apa (opsional)</label>'+taBox('hb_note',LIM_NOTE,'')+
    '<button class="btn" id="hb_save" onclick="addHambatan()">Simpan hambatan</button></div>';
  h+='<div class="card">'+(hb.length?hb.map(function(x){
    if(adm&&S.hbEdit===x.id)return '<div class="hb"><label class="lbl">Hambatan</label><input class="inp" id="he_title" maxlength="120" value="'+esc(x.title)+'">'+
      '<div class="grid2"><div><label class="lbl">Pemilik</label>'+ownerSel('he_owner',x.owner)+'</div><div><label class="lbl">Tenggat</label><input class="inp" type="date" id="he_due" value="'+esc(x.due)+'"></div></div>'+
      '<label class="lbl">Terlibat</label>'+hbChecks('he',hbInv(x))+
      '<label class="lbl">Catatan: siapa mengerjakan apa</label>'+taBox('he_note',LIM_NOTE,x.note)+
      '<div class="row" style="gap:8px"><button class="btn" id="he_save" onclick="saveHbEdit(\''+esc(x.id)+'\')">Simpan</button><button class="btn ghost" onclick="S.hbEdit=null;render()">Batal</button></div></div>';
    return '<div class="hb"><div class="row"><div class="kr-t">'+esc(x.title)+'</div><span class="tag sp '+(x.status==='Selesai'?'ok':x.status==='Dikerjakan'?'warn':'bad')+'">'+esc(x.status)+'</span></div>'+
      '<div class="sm mut" style="margin:4px 0 8px">'+hbWho(x)+' · tenggat '+dLabel(x.due)+(x.status!=='Selesai'&&x.due&&x.due<t?' <b style="color:var(--bad)">terlambat</b>':'')+'</div>'+(x.note?'<div class="sm" style="margin:0 0 8px">'+esc(x.note)+'</div>':'')+
      '<div class="row" style="gap:8px"><select class="sel" style="height:38px;font-size:12.5px" onchange="setHb(\''+esc(x.id)+'\',this.value)">'+['Terbuka','Dikerjakan','Selesai'].map(function(s){return '<option'+(s===x.status?' selected':'')+'>'+s+'</option>';}).join('')+'</select>'+
      (adm?'<button class="btn ghost" style="width:auto;padding:0 16px;height:38px" onclick="S.hbEdit=\''+esc(x.id)+'\';render()">Ubah</button>':'')+'</div></div>';}).join(''):'<div class="sm mut">Belum ada hambatan.</div>')+'</div>';
  return h;
}
function addHambatan(){
  var title=$('hb_title').value.trim();if(!title){toast('Judul hambatan masih kosong',true);return;}
  var ow=$('hb_owner').value;$('hb_save').disabled=true;HB_OPEN=false;
  hbSave({action:'hambatan',id:uid('h'),title:title,owner:ow,due:$('hb_due').value,status:'Terbuka',note:$('hb_note').value.trim(),terlibat:hbRead('hb',ow)},'Hambatan tersimpan').then(function(ok){if(!ok){HB_OPEN=true;render();}});
}
function saveHbEdit(id){
  var x=(D.hambatan||[]).filter(function(h){return h.id===id;})[0];if(!x)return;
  var title=$('he_title').value.trim();if(!title){toast('Judul hambatan masih kosong',true);return;}
  var ow=$('he_owner').value;$('he_save').disabled=true;
  hbSave({action:'hambatan',id:id,title:title,owner:ow,due:$('he_due').value,status:x.status,note:$('he_note').value.trim(),terlibat:hbRead('he',ow)},'Hambatan diubah').then(function(ok){if(ok)S.hbEdit=null;else $('he_save').disabled=false;render();});
}
function setHb(id,status){
  var x=(D.hambatan||[]).filter(function(h){return h.id===id;})[0];if(!x)return;
  saveAndReload({action:'hambatan',id:x.id,title:x.title,owner:x.owner,due:x.due,status:status,note:x.note,terlibat:x.terlibat===undefined?undefined:x.terlibat},'Status diperbarui');
}

// ═════════════ PENGATURAN (Manager) ═════════════
var AF=[['chatNew','Chat New Leads'],['chatEx','Chat Existing Leads'],['offTraffic','Customer Datang Offline'],['total','Jumlah Nota'],['online','Beli lewat chat (Deal Online)'],['rujukan','Pembeli dari rujukan Kumasindo'],['luarArea','Leads Luar Area'],['luarProduk','Leads Luar Produk'],['spam','Spam']];
function vSetelan(K){
  var rows=(D.angka||[]).slice().sort(function(a,b){return a.asOf<b.asOf?1:-1;}),last=rows[0]||{};
  var av=autoVals(today());
  // Spam (manual): ambil dari baris tanggal yang sama atau baris terakhir di bulan yang sama; bulan baru = kosong
  var ymT=today().slice(0,7),spamPre=(rows.filter(function(x){return x.asOf.slice(0,7)===ymT&&x.spam!=null;})[0]||{}).spam;
  var rv=rpVals(today());
  var fld=function(f){var isRp=RP_KEYS.indexOf(f[0])>=0,auto=isRp?!!(rv&&rv.covered):!!(av&&AUTO_KEYS.indexOf(f[0])>=0),val=auto?(isRp?rv[f[0]]:av[f[0]]):(f[0]==='spam'?(spamPre!=null?spamPre:''):(last[f[0]]!=null?last[f[0]]:''));
    return '<div><label class="lbl">'+f[1]+'</label><input class="inp'+(auto?' auto':'')+'" type="number" inputmode="numeric" min="0" step="1" id="a_'+f[0]+'" value="'+val+'"'+(auto?' readonly':'')+' oninput="angkaLive()"></div>';};
  var h='<div class="vhead"><div class="mid">Pengaturan Manager</div><div class="sm mut">Angka bulanan dan target. Tim tidak melihat halaman ini.</div></div>';
  h+='<div class="card"><div class="h">1 · Update angka</div><div class="sm mut" style="margin-bottom:6px">Isi <b>kumulatif sejak tanggal 1</b> bulan itu, bukan angka per minggu. Satu tanggal = satu baris; tanggal yang sama akan menimpa. <b>Chat New, Chat Existing, Customer Datang Offline, Leads Luar Area, Leads Luar Produk, Jumlah Nota, dan Beli lewat chat terisi otomatis dari Performance Toko</b> (tidak bisa diketik). Hanya Rujukan dan Spam yang diisi di sini.</div>'+
    '<label class="lbl">Angka per tanggal</label><input class="inp" type="date" id="a_asOf" value="'+today()+'" oninput="onAsOf()"><div id="a_src" class="sm" style="margin:10px 0 2px"></div><div id="a_rp" class="sm" style="margin:6px 0 2px"></div>'+
    '<div class="grp"><b>Total Traffic</b> = chat baru + chat lama + datang ke toko <span class="tag ok">OTOMATIS</span></div><div class="sm mut" style="margin-bottom:10px">Dari Performance Toko: Chat New Leads, Chat Existing Leads, dan Leads Offline (customer datang ke toko). Kalau orang yang sama awalnya chat lalu datang ke toko, CS mencatatnya <b>hanya</b> di Leads Offline.</div>'+
    '<div class="grid2 gridB">'+AF.slice(0,3).map(fld).join('')+'</div>'+
    '<div class="grp"><b>Transaksi</b> <span class="tag ok">OTOMATIS</span></div><div class="sm mut" style="margin-bottom:10px">Dari tab REPORT: Jumlah Nota = semua nota, online dan di toko. Beli lewat chat = nota ONLINE (kesepakatannya terjadi lewat chat).</div>'+
    '<div class="grid2">'+AF.slice(3,5).map(fld).join('')+'</div>'+
    '<div class="grp"><b>Asal pembeli</b></div><div class="sm mut" style="margin-bottom:10px">Hanya pembeli yang sudah ditanya asalnya. Yang belum ditanya jangan dimasukkan.</div>'+
    '<div class="grid2">'+AF.slice(5,6).map(fld).join('')+'</div>'+
    '<div class="grp"><b>Traffic baru yang tidak valid</b> <span class="mut">(untuk Advertiser)</span></div><div class="sm mut" style="margin-bottom:10px">Dari Chat New Leads di atas, berapa yang tidak layak dilayani: di luar area layanan, di luar produk yang dijual, atau spam. Valid Traffic = Chat New Leads − ketiganya. <b>Luar Area dan Luar Produk otomatis</b> dari Performance Toko (jumlah angkanya); <b>Spam diisi manual</b>.</div>'+
    '<div class="grid2 gridB">'+AF.slice(6).map(fld).join('')+'</div>'+
    '<div id="a_live" style="margin-top:16px"></div><button class="btn" id="a_save" onclick="saveAngka()">Simpan angka</button></div>';
  var c=K.c,LBL={};CFG_FIELDS.forEach(function(f){LBL[f[0]]=f[1];});
  var inp=function(k,ro){return '<div><label class="lbl">'+LBL[k]+'</label><input class="inp'+(ro?' ro':'')+'" type="number" step="'+(k==='conv_target'||k==='t_vtr'?'0.1':'1')+'" min="0" id="cf_'+k+'" value="'+(c[k]==null?'':c[k])+'"'+(ro?' readonly':'')+'></div>';};
  h+='<div class="card"><div class="h">2 · Target</div>'+
    '<div class="grp" style="margin-top:6px;border-top:none;padding-top:0"><span class="tag na">TERKUNCI</span> <b>Patokan awal dan target KR 1 dan KR 2</b></div><div class="sm mut">Sudah disepakati. Semua status dihitung dari angka ini. Jangan diubah kecuali rencananya berubah.</div>'+
    '<div class="cfg-grid">'+CFG_LOCK.map(function(f){return inp(f[0],true);}).join('')+'</div>'+
    '<div class="sm" style="margin-top:12px">'+(K.convBase!=null?'Patokan KR 1 = '+n0(c.nota_base)+' ÷ '+n0(c.traffic_base)+' = <b>'+pc(K.convBase)+'</b>'+(K.convTarget!=null?' → target <b>'+pc(K.convTarget)+'</b>. Target tiap bulan naik bertahap dari patokan ke target akhir periode.':'. Target belum diisi.'):'Isi Total Traffic dan Jumlah Nota patokan awal supaya patokan KR 1 terhitung (Jumlah Nota ÷ Total Traffic).')+' KR 2 memakai patokan Jumlah Nota yang sama.</div>'+
    '<div class="grp"><span class="tag na">TERKUNCI</span> <b>Indikator Online / CS</b> <span class="mut">(bukan KR)</span></div><div class="sm mut">Dipakai untuk Online Chat Conversion Rate = Deal Online ÷ chat masuk, kartu Tri. Tidak mempengaruhi KR 1.</div>'+
    '<div class="cfg-grid">'+CFG_ONLINE.map(function(f){return inp(f[0],true);}).join('')+'</div>'+
    '<div class="sm" style="margin-top:12px">Online Chat Conversion Rate: patokan <b>'+pc(K.oBase)+'</b> → target <b>'+pc(K.oTarget)+'</b>.</div>'+
    '<button class="btn ghost" id="cf_unlock" style="margin-top:12px" onclick="unlockCfg()">Buka kunci untuk mengubah</button>'+
    '<div class="grp"><span class="tag warn">ISI</span> <b>Target kontribusi per orang, per bulan</b></div><div class="sm mut">Target creative Brand Creator tidak diisi di sini. Kosongkan kalau belum ada: baris tanpa target tampil tanpa status.</div>'+
    '<div class="cfg-grid">'+CFG_TARGET.map(function(f){return inp(f[0],false);}).join('')+'</div>'+
    '<button class="btn" id="cf_save" style="margin-top:18px" onclick="saveCfg()">Simpan target</button></div>';
  var b=bcMonth();h+='<div class="card g"><div class="h">Sambungan Brand Creator</div><div class="sm">'+(b?'<b style="color:var(--ok)">Tersambung.</b> Toko Kubah Emas, bulan '+esc(b.m)+': '+n0(b.made)+' creative dibuat, '+n0(b.tested)+' diuji, '+n0(b.win)+' winner.':'<b style="color:var(--bad)">Tidak tersambung.</b> '+esc(S.bcErr||'Belum dimuat.'))+'</div><div class="sm mut" style="margin-top:4px">Hanya divisi Toko Kubah Emas yang dihitung. Target creative diambil dari tab Manager Brand Creator (baris Kubah Emas). Target Winner Brand Creator berlaku gabungan dengan Kumasindo, jadi target Winner Toko diisi di bawah.</div></div>';
  h+='<div class="sm mut" style="text-align:center;margin:6px 0 14px">Versi app: '+APP_VER+' · Apps Script: v'+(D.v||'?')+'</div>';
  return h;
}
function unlockCfg(){document.querySelectorAll('input.ro').forEach(function(i){i.removeAttribute('readonly');i.classList.remove('ro');});var b=$('cf_unlock');if(b)b.style.display='none';toast('Kunci terbuka. Hati-hati: semua status dihitung dari angka ini.');}
function angkaVals(){
  var v={asOf:$('a_asOf').value},bad=[];
  AF.forEach(function(f){var s=$('a_'+f[0]).value;v[f[0]]=s===''?null:Number(s);if(s===''||isNaN(v[f[0]])||v[f[0]]<0||v[f[0]]!==Math.floor(v[f[0]]))bad.push(f[0]);});
  return {v:v,bad:bad};
}
function angkaLive(){
  var el=$('a_live');if(!el)return;var r=angkaVals(),v=r.v,sv=$('a_save');
  var outP=(v.asOf&&(v.asOf<PERIOD.start||v.asOf>PERIOD.end))?'<div class="sm" style="color:var(--warn);font-weight:700;margin-top:6px">Tanggal ini di luar periode OKR ('+dLabel(PERIOD.start)+' – '+dLabel(PERIOD.end)+'): angka tersimpan tapi tidak dihitung.</div>':'';
  var am=autoMsgs(v.asOf);
  var amHtml=am.errs.map(function(e){return '<div class="sm" style="color:var(--bad);font-weight:700;margin-top:6px">'+esc(e)+'</div>';}).join('')+am.warns.map(function(e){return '<div class="sm" style="color:var(--warn);font-weight:700;margin-top:6px">'+esc(e)+'</div>';}).join('');
  if(r.bad.length){el.innerHTML='<div class="sm mut">Lengkapi semua kolom dengan bilangan bulat ≥ 0.</div>'+outP+amHtml;sv.disabled=true;return;}
  var errs=am.errs.slice(),warns=am.warns.slice();
  if(!v.asOf)errs.push('Tanggal belum diisi.');
  var same=(D.angka||[]).filter(function(x){return x.asOf===v.asOf;})[0];
  var sum=v.rujukan+(same?same.iklan+same.konten+same.lainnya:0);
  if(v.online>v.total)errs.push('Deal Online ('+n0(v.online)+') tidak boleh lebih besar dari Jumlah Nota ('+n0(v.total)+').');
  if(sum>v.total)errs.push('Jumlah asal pembeli ('+n0(sum)+') melebihi Jumlah Nota ('+n0(v.total)+').');
  var inv=v.luarArea+v.luarProduk+v.spam;
  if(inv>v.chatNew)errs.push('Leads tidak valid ('+n0(inv)+') tidak boleh lebih besar dari Chat New Leads ('+n0(v.chatNew)+').');
  var traffic=v.chatNew+v.chatEx+v.offTraffic;
  if(v.total>traffic)warns.push('Jumlah Nota ('+n0(v.total)+') lebih besar dari Total Traffic ('+n0(traffic)+'). Cek: apakah semua pembeli sudah masuk hitungan traffic?');
  // angka kumulatif tidak boleh lebih kecil dari baris sebelumnya di bulan yang sama
  var prev=null;(D.angka||[]).forEach(function(x){if(v.asOf&&x.asOf<v.asOf&&x.asOf.slice(0,7)===v.asOf.slice(0,7)&&(!prev||x.asOf>prev.asOf))prev=x;});
  if(prev){var pf={chatNew:'Chat New Leads',chatEx:'Chat Existing Leads',offTraffic:'Customer Datang Offline',total:'Jumlah Nota',online:'Deal Online',rujukan:'Rujukan',luarArea:'Leads Luar Area',luarProduk:'Leads Luar Produk',spam:'Spam'};
    Object.keys(pf).forEach(function(k){if(prev[k]!=null&&v[k]<prev[k])warns.push(pf[k]+' lebih kecil dari angka '+dLabel(prev.asOf)+' ('+n0(prev[k])+'). Angka harus kumulatif.');});}
  var chat=v.chatNew+v.chatEx;
  var html='<div class="sm">Total Traffic: <b>'+n0(traffic)+'</b> · Konversi (KR 1): <b>'+(traffic>0?pc(v.total/traffic):'—')+'</b> · Online Chat Conversion: <b>'+(chat>0?pc(v.online/chat):'—')+'</b> · Valid Traffic: <b>'+n0(v.chatNew-inv)+'</b> ('+(v.chatNew>0?pc((v.chatNew-inv)/v.chatNew):'—')+')</div>'+outP;
  html+=errs.map(function(e){return '<div class="sm" style="color:var(--bad);font-weight:700;margin-top:6px">'+esc(e)+'</div>';}).join('')+warns.map(function(e){return '<div class="sm" style="color:var(--warn);font-weight:700;margin-top:6px">'+esc(e)+'</div>';}).join('');
  el.innerHTML=html;sv.disabled=errs.length>0;
}
function saveAngka(){
  var r=angkaVals();if(r.bad.length)return;var v=r.v;
  var same=(D.angka||[]).filter(function(x){return x.asOf===v.asOf;})[0];   // Iklan, Konten, Lainnya tidak ditanyakan lagi; nilai lama di tanggal yang sama dipertahankan
  var p={action:'angka',asOf:v.asOf,chatNew:v.chatNew,chatEx:v.chatEx,offTraffic:v.offTraffic,luarArea:v.luarArea,luarProduk:v.luarProduk,spam:v.spam,online:v.online,total:v.total,iklan:same?same.iklan:0,konten:same?same.konten:0,rujukan:v.rujukan,lainnya:same?same.lainnya:0};
  $('a_save').disabled=true;
  saveAndReload(p,'Angka tersimpan').then(function(ok){if(!ok){var e=$('a_save');if(e)e.disabled=false;}});
}
function saveCfg(){
  var cur=cfg(),vals={},bad=null;
  CFG_FIELDS.forEach(function(f){var s=$('cf_'+f[0]).value.trim(),n=s===''?null:Number(s);
    if(s!==''&&(isNaN(n)||n<0||((f[0]==='conv_target'||f[0]==='t_vtr')&&n>100)))bad=f[1];
    var old=cur[f[0]];if((n==null?'':n)!==(old==null?'':old))vals[f[0]]=s;});
  if(bad){toast('Nilai tidak valid: '+bad,true);return;}
  if(!Object.keys(vals).length){toast('Tidak ada perubahan');return;}
  $('cf_save').disabled=true;
  saveAndReload({action:'config',values:vals},'Target tersimpan').then(function(ok){if(!ok){var e=$('cf_save');if(e)e.disabled=false;}});
}
