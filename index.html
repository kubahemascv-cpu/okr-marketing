<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OKR Kubah Emas</title>
<meta name="theme-color" content="#1F2128">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OKR Kubah Emas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --m:#C81E8C;--m-hi:#FF5CB1;--m-d:#9B1259;--m-l:#FCE8F4;--m-b:#F3B5DA;
  --ch:#1F2128;--ch2:#2A2D36;--bg:#F4F4F6;--bg2:#E9E9EE;--card:#fff;--card2:#FAFAFB;
  --txt:#1F2128;--txt2:#41454F;--mut:#80848F;--bdr:#E6E6EB;
  --ok:#16A34A;--ok-l:#E8F7EE;--warn:#D97706;--warn-l:#FEF3E2;--bad:#DC2626;--bad-l:#FEF3F2;
  --shd:0 1px 2px rgba(31,33,40,.04),0 6px 20px rgba(31,33,40,.05);
  --font:'Plus Jakarta Sans',-apple-system,sans-serif;--r:18px;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;padding-bottom:96px}
button,input,select,textarea{font-family:var(--font)}
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bdr);padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top))}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#E0309B,#C81E8C);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;letter-spacing:.04em;color:#fff;flex-shrink:0}
.bn{font-size:15px;font-weight:800;letter-spacing:-.01em}.bs{font-size:11px;color:var(--mut)}
.who{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--ch);color:var(--m-hi);padding:8px 13px;border-radius:999px;border:none;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--shd);padding:18px;margin-bottom:14px}
.hero{background:radial-gradient(120% 140% at 100% 0%,rgba(200,30,140,.34),transparent 55%),var(--ch);color:#fff;border:none}
.hero .mut{color:rgba(255,255,255,.62)}
.mut{color:var(--mut)}
.h{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.hero .h{color:rgba(255,255,255,.55)}
.big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.hero .big{color:var(--m-hi)}
.hero .fill{background:var(--m-hi)}
.mid{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.sm{font-size:12px;line-height:1.55}
.bar{height:9px;border-radius:99px;background:var(--bdr);overflow:hidden;margin-top:12px}
.hero .bar{background:rgba(255,255,255,.14)}
.fill{height:100%;border-radius:99px;background:var(--m)}
.fill.ok{background:var(--ok)}.fill.warn{background:var(--warn)}.fill.bad{background:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.sp{margin-left:auto}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--ok-l);color:var(--ok)}.tag.warn{background:var(--warn-l);color:var(--warn)}.tag.bad{background:var(--bad-l);color:var(--bad)}.tag.na{background:var(--bg2);color:var(--mut)}
.note{display:flex;gap:10px;font-size:12px;line-height:1.55;padding:11px 13px;border-radius:13px;background:var(--card2);border:1px solid var(--bdr);margin-bottom:14px;color:var(--txt2)}
.note.warn{background:var(--warn-l);border-color:#F6D8A8;color:#7C4A03}
.note.bad{background:var(--bad-l);border-color:#FBC9C4;color:#8F1D14}
.note.ok{background:var(--ok-l);border-color:#BDE5CC;color:#14532D}
.kr-t{font-size:13.5px;font-weight:800;line-height:1.35}
.kr-r{font-size:11px;color:var(--mut);font-weight:600;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:8px 6px;text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);border-bottom:2px solid var(--bdr)}
td{padding:10px 6px;border-bottom:1px solid var(--bdr)}
th.r,td.r{text-align:right}
tr:last-child td{border-bottom:none}
tr.cur td{background:var(--m-l);font-weight:700}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--mut);margin:12px 0 6px}
.lbl:first-child{margin-top:0}
.inp,.sel,.ta{width:100%;border:1.5px solid var(--bdr);border-radius:13px;background:var(--card2);padding:0 14px;font-size:14px;font-weight:600;color:var(--txt);outline:none}
.inp,.sel{height:46px}
.ta{padding:12px 14px;min-height:78px;resize:vertical;font-weight:500;line-height:1.5}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--m);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;height:50px;border:none;border-radius:14px;background:var(--m);color:#fff;font-size:14.5px;font-weight:800;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--bg2);color:var(--txt)}
.btn.sm{height:38px;font-size:12.5px;margin-top:0;width:auto;padding:0 16px;border-radius:11px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1.5px solid var(--bdr);background:var(--card);border-radius:99px;padding:9px 15px;font-size:12.5px;font-weight:700;color:var(--txt2);cursor:pointer}
.chip.on{background:var(--ch);color:var(--m-hi);border-color:var(--ch)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bdr);padding:8px 8px max(8px,env(safe-area-inset-bottom))}
.nav-in{max-width:760px;margin:0 auto;display:flex;gap:2px}
.nav button{flex:1;border:none;background:none;padding:7px 2px;border-radius:12px;font-size:10.5px;font-weight:700;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .ic{font-size:19px;line-height:1}
.nav button.on{background:var(--ch);color:var(--m-hi)}
.gate{max-width:380px;margin:12vh auto 0;padding:0 18px;text-align:center}
.gate .logo{width:64px;height:64px;font-size:18px;border-radius:19px;margin:0 auto 18px}
.pin{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:800}
.pick{display:flex;flex-direction:column;gap:10px;text-align:left}
.pick button{border:1.5px solid var(--bdr);background:var(--card);border-radius:15px;padding:14px 16px;cursor:pointer;text-align:left}
.pick b{display:block;font-size:15px}.pick span{font-size:11.5px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ch);color:#fff;padding:11px 18px;border-radius:99px;font-size:12.5px;font-weight:700;z-index:99;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}
.hb{border-top:1px solid var(--bdr);padding:12px 0}
.hb:first-child{border-top:none;padding-top:0}
.spin{text-align:center;padding:60px 0;color:var(--mut);font-size:13px;font-weight:600}
input[type=range]{width:100%;accent-color:#1F2128;height:34px}
.conf{font-size:28px;font-weight:800;text-align:center}
@media(max-width:380px){.big{font-size:32px}.grid2{grid-template-columns:1fr}}
.vhead .mid{margin-bottom:4px}.vhead .sm{margin-bottom:14px}
.cfg-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
.objstrip{border-left:4px solid var(--m)}
.objstrip .obj{font-size:16px;font-weight:800;line-height:1.35;margin:4px 0 6px}
.nav-in.dense button{font-size:9.5px;white-space:nowrap;padding:7px 0}@media (min-width:1000px){.nav-in.dense button{font-size:13.5px;padding:12px 14px}}
.splitbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--bdr);margin:12px 0 8px}.splitbar span{display:block;height:100%}
.sp-v{background:var(--m-hi)}.sp-k{background:var(--m-d)}
.splitrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0}.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.splitcard .note{margin:10px 0}
.chks{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.chks label{display:flex;align-items:center;gap:7px;border:1.5px solid var(--bdr);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--card)}
.chks input{width:16px;height:16px;accent-color:var(--m)}
.fungsi{font-size:13px;line-height:1.5;color:var(--txt2);margin:6px 0 8px}
.grp{margin:22px 0 4px;padding-top:16px;border-top:1px solid var(--bdr);font-size:13px}
.grp:first-of-type{margin-top:14px}
.grp .tag{margin-right:6px}
.inp.ro{background:var(--bg2);color:var(--mut);cursor:not-allowed}
table.auto td:first-child{font-weight:600}

.nav button .nl{display:block}

/* ═════════ DESKTOP (≥1000px): navigasi di samping, area utama melebar mengikuti layar ═════════ */
@media(min-width:1000px){
  :root{--topH:61px;--sideW:224px}
  body.shell{padding-left:var(--sideW);padding-bottom:0}
  body.shell .top{margin-left:calc(-1*var(--sideW))}
  .top-in{max-width:none;padding:0 20px}
  .nav{top:var(--topH);bottom:0;left:0;right:auto;width:var(--sideW);border-top:none;border-right:1px solid var(--bdr);padding:18px 12px;overflow-y:auto;background:#fff}
  .nav-in{max-width:none;flex-direction:column;gap:6px}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:13px;font-size:13.5px;text-align:left}
  .nav button .ic{font-size:18px;width:24px;text-align:center}
  .nav button:hover:not(.on){background:var(--bg2)}
  .wrap{max-width:none;margin:0;padding:26px 32px 40px}
  body.shell #view{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:16px;align-items:start}
  body.shell #view>*{grid-column:1/-1;margin-bottom:0}
  body.shell #view>.g{grid-column:auto}
  body.shell #view>.narrow{max-width:760px}
  body.shell #view>.btn{width:auto;justify-self:start;padding:0 22px;margin:0}
  body.shell #view>.note{max-width:980px}
  .vhead .sm{margin-bottom:0}
  .vhead .mid{font-size:28px;margin-bottom:6px}
  .card{margin-bottom:0}
  .gridA{grid-template-columns:repeat(4,1fr)}
  .gridB{grid-template-columns:repeat(3,1fr)}
  .grid2{margin-top:14px}
  .hb .sel{max-width:260px}
  .cfg-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  body.shell .papan-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:16px;align-items:start}
  .papan-top .stack{display:flex;flex-direction:column;gap:16px}
  .toast{bottom:28px;left:calc(50% + var(--sideW)/2)}
}
</style>
</head>
<body>
<div class="top" id="top" style="display:none"><div class="top-in">
  <div class="logo">OKR</div>
  <div><div class="bn">OKR Kubah Emas</div><div class="bs" id="bs">Nov 2026 – Jan 2027</div></div>
  <button class="who" id="whobtn" onclick="switchWho()"></button>
</div></div>
<div class="wrap" id="view"></div>
<div class="nav" id="nav" style="display:none"><div class="nav-in" id="navin"></div></div>
<div id="toastbox"></div>

<script>
// ═════════════ KONFIGURASI ═════════════
var APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbzMAsn2ClE8-Roz1UY5lkM7hHqw5T5ulNGOL0v0ybLIZhWHelUeoiFGjmYEHAILi52b/exec';   // URL Apps Script (/exec) — diisi setelah deploy
var PIN='1601';
var PERIOD={start:'2026-11-01',end:'2027-01-31',months:['2026-11','2026-12','2027-01']};
var OBJ_TEXT='Lebih banyak orang yang bertanya di Kubah Emas akhirnya membeli.';
var MONTH_ID=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var PEOPLE={
  Lukman:{role:'Manager Marketing + Advertising',krs:['mgr','ads'],angka:true,admin:true},
  Dicky:{role:'Brand Creator',krs:['brand']},
  Tri:{role:'CS Kubah Emas',krs:['cs']},
  Faizal:{role:'CS Kumasindo',krs:['kum']}
};
var KRS={
  mgr:{person:'Lukman',role:'Manager Marketing',title:'Hambatan terbesar terhadap konversi teratasi'},
  ads:{person:'Lukman',role:'Advertising',title:'Pembelian dari calon pembeli iklan'},
  brand:{person:'Dicky',role:'Brand Creator',title:'Pembelian yang terbantu konten'},
  cs:{person:'Tri',role:'CS Kubah Emas',title:'Konversi chat yang ditangani menjadi pembelian'},
  kum:{person:'Faizal',role:'CS Kumasindo',title:'Pelanggan rujukan yang membeli di toko'}
};
var PERAN_DEFAULT={
  mgr:'Mencari dan menyingkirkan hambatan terbesar yang membuat orang bertanya tapi tidak membeli.',
  ads:'Membawa calon pembeli yang tepat lewat iklan, bukan sekadar chat yang banyak.',
  brand:'Membuat konten yang membantu orang memutuskan membeli: bukti, harga, cara pesan.',
  cs:'Mengubah chat yang masuk menjadi pembelian: balas cepat, jawab tuntas, tutup dengan deal.',
  kum:'Mengajak pelanggan Kumasindo membeli di toko Kubah Emas lewat rujukan.'
};
var PERAN_MAX=200;
var DEFAULTS={chat_base:1800,online_base:110,total_base:441,online_target:144,online_stretch:182,total_target:513,total_target_final:0,ads_target:null,konten_target:null,rujukan_target:null};
var CFG_FIELDS=[
  ['chat_base','Chat masuk per bulan (baseline)'],['online_base','Deal Online per bulan (baseline)'],['total_base','Total pembelian per bulan (baseline)'],
  ['online_target','Target Deal Online, Januari (committed)'],['online_stretch','Target Deal Online, stretch'],['total_target','Target total pembelian perusahaan'],
  ['total_target_final','Target total sudah final? (1 = ya, 0 = belum)'],
  ['ads_target','Target pembelian dari iklan, Januari'],['konten_target','Target pembelian terbantu konten, Januari'],['rujukan_target','Target pembelian dari rujukan Kumasindo, Januari']
];

// ═════════════ UTIL ═════════════
var S={ok:false,who:'',tab:'home',loaded:false,err:'',krSel:'',reviewMonth:'',peranEdit:'',hbEdit:''};
var D={config:{},checkins:[],angka:[],hambatan:[],review:[]};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function p2(n){return String(n).padStart(2,'0');}
function dstr(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function today(){return dstr(new Date());}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function weekStart(s){var d=pd(s||today());var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dstr(d);}
function dim(ym){var a=ym.split('-');return new Date(+a[0],+a[1],0).getDate();}
function peranRow(id){return (D.peran||[]).filter(function(r){return r.kr===id;})[0]||null;}
function peranOf(id){var r=peranRow(id);return r&&r.text?r.text:PERAN_DEFAULT[id];}
function ymLabel(ym){var a=ym.split('-');return MONTH_ID[+a[1]-1]+' '+a[0];}
function ymShort(ym){var a=ym.split('-');return MONTH_ID[+a[1]-1].slice(0,3)+' '+a[0];}
function dLabel(s){if(!s)return '—';var d=pd(s);return d.getDate()+' '+MONTH_ID[d.getMonth()].slice(0,3)+' '+d.getFullYear();}
function n0(n){return Math.round(n).toLocaleString('id-ID');}
function pc(x,dec){return (x*100).toFixed(dec==null?1:dec).replace('.',',')+'%';}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(msg,bad){var t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=msg;$('toastbox').appendChild(t);setTimeout(function(){t.remove();},bad?4500:2200);}

// ═════════════ API ═════════════
function apiReady(){return APPS_SCRIPT_URL&&APPS_SCRIPT_URL.indexOf('PASTE_')!==0;}
function apiLoad(){
  return fetch(APPS_SCRIPT_URL+'?action=load&pin='+encodeURIComponent(PIN)+'&cb='+Date.now()).then(function(r){return r.json();}).then(function(j){
    if(!j.ok) throw new Error(j.error||'Server menolak permintaan');
    D={config:j.config||{},checkins:j.checkins||[],angka:j.angka||[],hambatan:j.hambatan||[],review:j.review||[],peran:j.peran||[]};
  });
}
function apiPost(p){
  return fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({pin:PIN,by:S.who},p))})
    .then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Gagal menyimpan');return j;});
}
function saveAndReload(p,okMsg){
  return apiPost(p).then(function(){return apiLoad();}).then(function(){toast(okMsg||'Tersimpan');render();return true;})
    .catch(function(e){toast(String(e.message||e),true);return false;});
}

// ═════════════ KONFIG & PERHITUNGAN ═════════════
function cfg(){
  var c={};
  Object.keys(DEFAULTS).forEach(function(k){
    var raw=D.config?D.config[k]:undefined;
    if(raw===undefined)c[k]=DEFAULTS[k];
    else if(raw==='')c[k]=null;
    else{var n=Number(raw);c[k]=isNaN(n)?DEFAULTS[k]:n;}
  });
  return c;
}
function calc(){
  var c=cfg(), tm=today().slice(0,7);
  var rows=(D.angka||[]).slice().sort(function(a,b){return a.asOf<b.asOf?-1:a.asOf>b.asOf?1:0;});
  var byM={};rows.forEach(function(r){byM[r.asOf.slice(0,7)]=r;});
  var convBase=c.chat_base>0?c.online_base/c.chat_base:0;
  var convTarget=c.chat_base>0?c.online_target/c.chat_base:0;
  var months=PERIOD.months.map(function(ym,i){
    var r=byM[ym], f=(i+1)/3;
    var m={ym:ym,i:i+1,has:!!r,
      msOnline:c.online_base+(c.online_target-c.online_base)*f,
      msConv:convBase+(convTarget-convBase)*f};
    if(r){
      var day=+r.asOf.slice(8), d=dim(ym);
      var running=day<d, k=running?d/day:1;   // entri yang bukan tanggal terakhir bulan selalu diproyeksikan (bulan lewat pun)
      m.asOf=r.asOf;m.day=day;m.dim=d;m.running=running;m.early=running&&day<7;m.factor=k;
      m.chat=r.chat;m.online=r.online;m.total=r.total;m.iklan=r.iklan;m.konten=r.konten;m.rujukan=r.rujukan;m.lainnya=r.lainnya;
      m.projChat=r.chat*k;m.projOnline=r.online*k;m.projTotal=r.total*k;m.projIklan=r.iklan*k;m.projKonten=r.konten*k;m.projRujukan=r.rujukan*k;
      m.conv=r.chat>0?r.online/r.chat:null;
      m.unattr=r.total-(r.iklan+r.konten+r.rujukan+r.lainnya);
    }
    return m;
  });
  var act=null;months.forEach(function(m){if(m.has)act=m;});
  var onDen=(c.online_target-c.online_base)||1;
  var progress=act?(act.projOnline-c.online_base)/onDen:null;
  var hb=D.hambatan||[], closed=hb.filter(function(h){return h.status==='Selesai';}).length;
  return {c:c,months:months,act:act,progress:progress,convBase:convBase,convTarget:convTarget,
    hbTotal:hb.length,hbClosed:closed,hbPct:hb.length?closed/hb.length:null};
}
function statusOf(p){return p==null?'na':p>=1?'ok':p>=0.7?'warn':'bad';}
function statusTxt(p){return p==null?'—':p>=1?'On track':p>=0.7?'Waspada':'Tertinggal';}

// KR personal (Iklan/Konten/Rujukan): patokan = angka November, naik bertahap ke target Januari (Nov patokan, Des tengah, Jan target)
function persMs(id,K){
  var c=K.c,m={ads:['projIklan',c.ads_target],brand:['projKonten',c.konten_target],kum:['projRujukan',c.rujukan_target]}[id],m1=K.months[0];
  return {key:m[0],tgt:m[1],base:(m1&&m1.has)?m1[m[0]]:null};
}
function persRatio(v,base,tgt,i){var ms=base+(tgt-base)*((i-1)/2),den=ms-base;return den>0?(v-base)/den:(v>=ms?1:0);}
// ukuran per KR (untuk kartu & review)
function krInfo(id,K){
  var c=K.c,a=K.act,o={id:id,pct:null,st:null,big:'—',sub:'',extra:''};
  if(id==='mgr'){
    o.big=K.hbTotal?K.hbClosed+' dari '+K.hbTotal+' hambatan tertutup':'Belum ada hambatan terdata';
    o.pct=K.hbTotal?(K.hbClosed/K.hbTotal)/0.8:null;o.st=o.pct;
    o.sub='Target: ≥3 hambatan prioritas terdata s.d. 14 Nov, ≥80% tertutup s.d. 31 Jan.';
    if(K.hbTotal) o.extra='Tertutup '+pc(K.hbClosed/K.hbTotal,0)+' (target 80%)';
  }else if(id==='cs'){
    if(a&&a.conv!=null){
      o.big=pc(a.conv);o.pct=(a.conv-K.convBase)/((K.convTarget-K.convBase)||1);o.st=(a.conv-K.convBase)/((a.msConv-K.convBase)||1);
      o.extra=(a.projOnline-c.online_base>=0?'+':'')+n0(a.projOnline-c.online_base)+' Deal Online dibanding baseline ('+n0(c.online_base)+')';
    }
    o.sub='Baseline '+pc(K.convBase)+' → target Januari '+pc(K.convTarget)+' (Deal Online ÷ chat masuk).';
  }else{
    var pi=persMs(id,K),tgt=pi.tgt;
    if(a){
      var v=a[pi.key];o.big=n0(v)+' pembelian'+(a.running?' (proyeksi bulan ini)':'');
      o.extra='Porsi jalurmu: '+(a.projTotal>0?pc(v/a.projTotal):'—')+' dari total pembelian bulan ini';
      if(tgt!=null&&pi.base!=null){var den=tgt-pi.base;o.pct=den>0?(v-pi.base)/den:(v>=tgt?1:0);o.st=a.i===1?null:persRatio(v,pi.base,tgt,a.i);}
    }
    o.sub=tgt==null?'Target dikunci 30 Nov, setelah baseline November terkumpul.':pi.base!=null?'Patokan November '+n0(pi.base)+' → target Januari '+n0(tgt)+' pembelian per bulan. November tidak dinilai.':'Target Januari: '+n0(tgt)+' pembelian per bulan. Patokan November belum ada.';
  }
  return o;
}
function krScore(id,m,K){ // skor 0.0-1.0 per bulan
  if(!m.has)return null;var c=K.c,s=null;
  if(id==='online')s=(m.projOnline-c.online_base)/((m.msOnline-c.online_base)||1);
  else if(id==='conv'||id==='cs')s=m.conv==null?null:(m.conv-K.convBase)/((m.msConv-K.convBase)||1);
  else if(id==='mgr'){s=(m.i===3&&K.hbPct!=null)?K.hbPct/0.8:null;}
  else{var pi=persMs(id,K);s=(pi.tgt==null||pi.base==null||m.i===1)?null:persRatio(m[pi.key],pi.base,pi.tgt,m.i);}
  return s==null?null:clamp(s,0,1);
}

    '<div class="sm mut" style="margin-bottom:22px">Masukkan PIN tim untuk membuka.</div>'+
    '<input class="inp pin" id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off" onkeydown="if(event.key===\'Enter\')tryPin()">'+
    '<div class="sm" id="pinerr" style="color:var(--bad);min-height:22px;margin-top:8px;font-weight:700"></div>'+
    '<button class="btn" onclick="tryPin()">Buka</button></div>';

function setWho(n){S.who=n;ls('okr_who',n);S.tab='home';start();}
function switchWho(){ls('okr_who',null);S.who='';pickWho();}
function start(){
  if(!S.ok){gate();return;}

  document.body.classList.add('shell');

function nav(){
  var P=PEOPLE[S.who],items=[['home','🏠','Beranda'],['papan','📊','Papan'],['checkin','✅','Check-in']];
  if(P.angka)items.push(['angka','🔢','Angka']);

  if(P.admin)items.splice(1,0,['tugas','📌','Tugas']);
  $('navin').classList.toggle('dense',items.length>6);
  $('navin').innerHTML=items.map(function(i){return '<button class="'+(S.tab===i[0]?'on':'')+'" onclick="go(\''+i[0]+'\')"><span class="ic">'+i[1]+'</span>'+i[2]+'</button>';}).join('');

function go(t){S.tab=t;render();window.scrollTo(0,0);}
function render(){
  if(!S.ok||!S.who)return;
  nav();
  if(S.err&&!S.loaded){$('view').innerHTML='<div class="card"><div class="mid" style="margin-bottom:8px">Gagal memuat data</div><div class="sm mut" style="margin-bottom:6px">'+esc(S.err)+'</div><button class="btn" onclick="start()">Coba lagi</button></div>';return;}
  var K=calc(),h='';
  if(PEOPLE[S.who].angka===undefined&&S.tab==='angka')S.tab='home';
  if(!PEOPLE[S.who].admin&&S.tab==='tugas')S.tab='home';
  if(S.tab==='home')h=vHome(K);else if(S.tab==='papan')h=vPapan(K);else if(S.tab==='checkin')h=vCheckin(K);
  else if(S.tab==='tugas')h=vTugas(K);else if(S.tab==='angka')h=vAngka(K);else if(S.tab==='hambatan')h=vHambatan(K);else if(S.tab==='review')h=vReview(K);
  $('view').innerHTML=h;
  if(S.tab==='angka')angkaLive();
}

function weekDone(person,kr){var w=weekStart();return (D.checkins||[]).some(function(c){return c.person===person&&c.kr===kr&&c.week===w;});}
function lastConf(kr){var l=null;(D.checkins||[]).forEach(function(c){if(c.kr===kr&&(!l||c.week>l.week||(c.week===l.week&&c.ts>l.ts)))l=c;});return l;}

function objStrip(t){
  var tot=Math.round((pd(PERIOD.end)-pd(PERIOD.start))/86400000)+1,day=Math.round((pd(t)-pd(PERIOD.start))/86400000)+1,line;
  if(day<1)line='Periode mulai '+dLabel(PERIOD.start)+' ('+(1-day)+' hari lagi)';
  else if(day>tot)line='Periode sudah selesai ('+dLabel(PERIOD.end)+')';
  else line='Hari ke-'+day+' dari '+tot+' · '+(day===tot?'hari terakhir':(tot-day)+' hari lagi');
  return '<div class="card objstrip"><div class="h">Objective bersama · 13 minggu</div><div class="obj">'+esc(OBJ_TEXT)+'</div><div class="sm mut">'+esc(line)+'</div></div>';

// ═════════════ PAPAN ═════════════
// pemisah volume vs konversi: Deal Online = chat masuk × konversi.
// efek chat = (chat sekarang − chat baseline) × konversi baseline; sisanya = efek konversi (jumlahnya persis selisih Deal Online)
function splitVol(K){
  var a=K.act,c=K.c;
  if(!a||!(c.chat_base>0)||!(a.chat>0)||a.conv==null)return null;
  var C0=c.chat_base,D0=c.online_base,r0=D0/C0,C1=a.projChat,D1=a.projOnline,d=D1-D0,v=(C1-C0)*r0;
  return {a:a,C0:C0,C1:C1,D0:D0,D1:D1,r0:r0,r1:a.conv,d:d,v:v,k:d-v};
}
function splitVerdict(s){
  var d=s.d,v=s.v,k=s.k;
  if(Math.abs(d)<1&&Math.abs(v)<1)return ['','Belum ada perubahan berarti dari baseline.'];
  if(d>0){
    if(k>=0.7*d)return ['ok','Kenaikan sebagian besar dari <b>konversi</b>. Ini yang dicari untuk masalah "banyak tanya, sedikit membeli".'+(v<0?' Chat masuk justru turun.':'')];
    if(v>=0.5*d)return ['warn','Kenaikan sebagian besar dari <b>jumlah chat</b>, bukan konversi. Belum membuktikan penanya lebih sering membeli.'+(k<0?' Konversi justru turun.':'')];
    return ['','Kenaikan datang dari chat dan konversi bersama-sama.'];
  }
  if(k<0&&v<0)return ['bad','Deal Online di bawah baseline: chat dan konversi sama-sama turun.'];
  if(k<0)return ['bad','Deal Online di bawah baseline karena <b>konversi turun</b>. Chat masuk menahan.'];
  return ['warn','Deal Online di bawah baseline karena <b>chat turun</b>. Konversi menahan.'];
}
function sg(n){var r=Math.round(n);return r===0?'0':(r>0?'+':'−')+n0(Math.abs(r));}
function splitCard(K){
  var s=splitVol(K);if(!s)return '';
  var D=Math.round(s.d),V=Math.round(s.v),Kc=D-V,vd=splitVerdict(s),a=s.a,pt=(s.r1-s.r0)*100;
  var bar='';
  if(s.d>0&&s.v>=0&&s.k>=0){var pv=s.v/s.d*100;bar='<div class="splitbar"><span class="sp-v" style="width:'+pv.toFixed(1)+'%"></span><span class="sp-k" style="width:'+(100-pv).toFixed(1)+'%"></span></div>';}
  return '<div class="card g splitcard"><div class="kr-r">Pemisah volume dan konversi</div><div class="kr-t">Dari mana selisih Deal Online?</div>'+
    '<div class="sm mut" style="margin-top:4px">Deal Online = chat masuk × konversi. Kartu ini memisahkan keduanya.</div>'+
    '<table style="margin-top:10px"><tr><th></th><th class="r">Baseline</th><th class="r">'+esc(ymShort(a.ym))+(a.running?' (proyeksi)':'')+'</th><th class="r">Selisih</th></tr>'+
    '<tr><td>Chat masuk</td><td class="r">'+n0(s.C0)+'</td><td class="r">'+n0(s.C1)+'</td><td class="r">'+sg(s.C1-s.C0)+'</td></tr>'+
    '<tr><td>Konversi</td><td class="r">'+pc(s.r0)+'</td><td class="r">'+pc(s.r1)+'</td><td class="r">'+(Math.abs(pt)<0.05?'0':(pt>0?'+':'−')+Math.abs(pt).toFixed(1).replace('.',','))+' poin</td></tr>'+
    '<tr><td><b>Deal Online</b></td><td class="r">'+n0(s.D0)+'</td><td class="r">'+n0(s.D1)+'</td><td class="r"><b>'+sg(D)+'</b></td></tr></table>'+bar+
    '<div class="splitrow"><span><i class="sdot sp-v"></i>Karena chat masuk berubah</span><b>'+sg(V)+'</b></div>'+
    '<div class="splitrow"><span><i class="sdot sp-k"></i>Karena konversi berubah</span><b>'+sg(Kc)+'</b></div>'+
    note(vd[1],vd[0])+
    '<div class="sm mut">Efek chat = (chat sekarang − chat baseline) × konversi baseline. Sisanya efek konversi.'+(a.running?' Bulan berjalan memakai proyeksi'+(a.early?' awal (baru tanggal '+a.day+'), jadi pecahan ini masih bisa bergeser banyak':'')+'.':'')+'</div></div>';
}
function vPapan(K){
  var c=K.c,h='';
  h+='<div class="card hero"><div class="h">Objective · '+esc(dLabel(PERIOD.start))+' – '+esc(dLabel(PERIOD.end))+'</div><div class="mid" style="color:#fff">'+esc(OBJ_TEXT)+'</div></div>';
  h+='<div class="papan-top">'+peranCard(K)+'<div class="stack">';
  // KR1
  h+='<div class="card g"><div class="kr-r">KR1 · bersama</div><div class="kr-t">Deal Online per bulan: '+n0(c.online_base)+' → '+n0(c.online_target)+' <span class="mut" style="font-weight:600">(stretch '+n0(c.online_stretch)+')</span></div>'+
    '<table style="margin-top:10px"><tr><th>Bulan</th><th class="r">Target</th><th class="r">Aktual</th><th class="r">Status</th></tr>'+
    K.months.map(function(m){var p=m.has?(m.projOnline-c.online_base)/((m.msOnline-c.online_base)||1):null;

  var rows=(D.angka||[]).slice().sort(function(a,b){return a.asOf<b.asOf?-1:1;}),out=[],F=[['chat','Chat'],['online','Deal Online'],['total','Total'],['iklan','Iklan'],['konten','Konten'],['rujukan','Rujukan'],['lainnya','Lainnya']];

    F.forEach(function(f){if(b[f[0]]<a[f[0]])out.push(f[1]+' turun dari '+a[f[0]]+' ('+dLabel(a.asOf)+') ke '+b[f[0]]+' ('+dLabel(b.asOf)+')');});}

function mgrActions(K){

    var iv=hbInv(h),who=esc(h.owner)+(iv.length?' (bersama '+esc(iv.join(', '))+')':''),ttl='<b>'+esc(h.title)+'</b>',fk='Selesaikan hambatan "'+h.title+'" (tenggat '+dLabel(h.due)+')';
    if(h.due&&h.due<t)add('bad',ttl+' terlambat '+dDiff(t,h.due)+' hari (status '+esc(h.status)+'). Hubungi '+who+' hari ini: apa yang menghalangi, dan minta tenggat baru yang jelas.','hambatan',fk);
    else if(h.due&&h.due<=dAdd(t,2)){var l=dDiff(h.due,t);add('warn','Tenggat '+(l===0?'<b>hari ini</b>':l===1?'<b>besok</b>':l+' hari lagi')+': '+ttl+' (status '+esc(h.status)+'). Tanyakan ke '+who+' sudah sampai mana.','hambatan',fk);}
    else{var up=String(h.updated||h.created||'').slice(0,10);if(up&&h.status==='Terbuka'&&dDiff(t,up)>=4)add('warn',ttl+' belum bergerak '+dDiff(t,up)+' hari (masih Terbuka). Tanyakan ke '+who+'.','hambatan',fk);}
  });
  if((D.hambatan||[]).length<3)add(t>'2026-11-14'?'bad':'warn','Baru '+(D.hambatan||[]).length+' hambatan tercatat. Target: minimal 3 hambatan prioritas sampai 14 Nov.','hambatan');
  // angka
  var an=angkaAnomali();
  if(an.length)add('bad','Angka tidak kumulatif: '+esc(an.join('; '))+'. Angka harus jumlah sejak tanggal 1. Perbaiki di tab Angka.','angka');

  else if(last<dAdd(t,-6))add('warn','Angka terakhir '+dLabel(last)+', lebih dari 7 hari lalu.','angka');
  // asal pembeli
  if(a&&a.ym===t.slice(0,7)&&a.total>=20){var att=a.iklan+a.konten+a.rujukan+a.lainnya,sh=att/a.total;
    if(att>a.total)add('bad','Asal pembeli ('+att+') lebih besar dari total ('+a.total+'). Periksa angka.','angka');
    else if(sh<0.7)add('warn','Baru '+pc(sh,0)+' pembeli bulan ini tercatat asalnya ('+att+' dari '+a.total+'). Tanyakan ke Tri dan kasir: pertanyaan asal sudah ditanyakan di setiap transaksi?',null,'Tanyakan dan catat asal setiap pembeli');}
  // check-in
  var pend=pendingCheckins();
  if(dow===5||dow===6||dow===0){
    pend.forEach(function(p){add('warn',p.person===S.who?'Check-in Anda sendiri ('+esc(p.role)+') belum diisi.':'Ingatkan '+esc(p.person)+' lewat chat pribadi: check-in '+esc(p.role)+' belum masuk (batas Minggu malam).','checkin');});
    add('info','Setelah semua check-in masuk: baca kartu Check-in tim di Papan, pilih <b>satu</b> tindakan untuk minggu depan.','papan');
  }
  if(dow>=1&&dow<=3&&pw>='2026-11-02'){
    var seenP={};PERAN_ORDER.forEach(function(id){var d=KRS[id];if(d.person===S.who||seenP[d.person])return;
      var ok=(D.checkins||[]).some(function(x){return x.person===d.person&&x.kr===id&&x.week===pw;});
      if(!ok){seenP[d.person]=1;add('bad',esc(d.person)+' tidak check-in minggu lalu ('+esc(d.role)+'). Bicara langsung hari ini, bukan di grup: tanya apa yang menghalangi.','checkin');}});
  }
  PERAN_ORDER.forEach(function(id){var d=KRS[id];if(d.person===S.who)return;
    var l=(D.checkins||[]).filter(function(x){return x.person===d.person&&x.kr===id;}).sort(function(x,y){return x.week<y.week?1:x.week>y.week?-1:(x.ts<y.ts?1:-1);}),cur=l[0],prev=l[1];
    if(!cur||cur.week<pw)return;
    var why=[];if(cur.conf<=5)why.push('keyakinan '+cur.conf+'/10');if(prev&&cur.conf-prev.conf<=-2)why.push('turun '+(prev.conf-cur.conf)+' poin dari minggu sebelumnya');

  // target dan review
  var tg=[c.ads_target,c.konten_target,c.rujukan_target].some(function(v){return v==null;});
  if(tg&&t>='2026-11-28')add(t>='2026-11-30'?'bad':'warn','Tetapkan target Iklan, Konten, Rujukan di Review → Pengaturan (batas 30 Nov).','review');

    if(t>=ym+'-01'&&!(D.review||[]).some(function(r){return r.month===pm&&r.text;}))add(+t.slice(8)>7?'bad':'warn','Tulis Catatan evaluasi '+ymLabel(pm)+' di Review.','review');}
  // peringatan data
  if(a&&a.ym===t.slice(0,7)&&a.early){add('info','Data bulan ini baru '+a.day+' hari. Proyeksi belum stabil, jangan dipakai menilai orang sebelum hari ke-7.',null);

  var ord={bad:0,warn:1,info:2};A.sort(function(x,y){return ord[x.lv]-ord[y.lv];});
  return A;
}
function waMsgs(K,acts){
  var t=today(),dow=pd(t).getDay(),pp=periodDay(t),a=K.act,c=K.c,out=[];
  if(pp.day<1||pp.day>pp.tot)return [{when:'—',text:'Hari ini di luar periode OKR ('+dLabel(PERIOD.start)+' – '+dLabel(PERIOD.end)+'). Tidak ada pesan yang perlu dikirim.',skip:true}];
  var fk='';acts.forEach(function(x){if(!fk&&x.fokus)fk=x.fokus;});
  if(!fk)fk='Setiap chat yang masuk dibalas dan ditindaklanjuti sampai deal atau jelas tidak jadi';
  if(dow>=1&&dow<=5){
    var L=['Pagi tim. Hari ke-'+pp.day+' dari '+pp.tot+', tinggal '+(pp.tot-pp.day)+' hari.','Objective kita: lebih banyak orang yang bertanya akhirnya membeli.'];
    if(a&&a.ym===t.slice(0,7)){L.push(a.early?'Deal Online bulan ini sejauh ini: '+n0(a.online)+' (data '+a.day+' hari).':'Deal Online bulan ini: proyeksi '+n0(a.projOnline)+' (patokan bulan ini '+n0(a.msOnline)+', akhir Januari '+n0(c.online_target)+').');}
    if(dow===1)L.push('Minggu ke-'+clamp(Math.floor(dDiff(t,PERIOD.start)/7)+1,1,13)+' dari 13 dimulai.');
    L.push('Fokus hari ini: '+fk+'.');

  }

  if((dow===6||dow===0)&&pendingCheckins().length)out.push({when:dow===6?'Sabtu':'Minggu',text:'Pengingat: check-in minggu ini belum lengkap. Batasnya Minggu malam, cukup 1 menit di app.'});

  return out;
}
